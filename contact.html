<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Coin des Romans</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <a class="logo" href="index.html">📚 Coin des Romans</a>
    <nav>
        <a href="index.html">Accueil</a>
        <a href="romans.html">Romans</a>
        <a href="auteurs.html">Auteurs</a>
        <a href="favoris.html">❤️ Favoris (<span id="favoriteCount">0</span>)</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>
    <button id="themeButton" class="theme-btn">🌙</button>
</header>

<section class="page-banner">
    <span>✉️ ÉCRIVEZ-NOUS</span>
    <h1>Contact</h1>
    <p>Une suggestion, une question ou une recommandation de livre ?</p>
</section>

<section class="section" style="max-width: 600px; margin: 0 auto;">
    <form id="contactForm" style="display: flex; flex-direction: column; gap: 1rem;">
        <div>
            <label for="name" style="display:block; margin-bottom: 0.5rem;">Nom complet</label>
            <input type="text" id="name" required placeholder="Votre nom" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid #ccc;">
        </div>
        <div>
            <label for="email" style="display:block; margin-bottom: 0.5rem;">Adresse E-mail</label>
            <input type="email" id="email" required placeholder="votre@email.com" style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid #ccc;">
        </div>
        <div>
            <label for="message" style="display:block; margin-bottom: 0.5rem;">Message</label>
            <textarea id="message" rows="5" required placeholder="Votre message..." style="width: 100%; padding: 0.8rem; border-radius: 8px; border: 1px solid #ccc;"></textarea>
        </div>
        <button type="submit" class="outline-btn" style="cursor: pointer; padding: 0.8rem 1.5rem;">Envoyer le message</button>
    </form>
</section>

<footer>
    <h3>📚 Coin des Romans</h3>
    <p>Un livre, une histoire, un nouveau voyage.</p>
    <p>© 2026 Coin des Romans</p>
</footer>

<script src="script.js"></script>
</body>
</html>
